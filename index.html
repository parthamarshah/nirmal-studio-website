<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title/description are tuned for local search: Ahmedabad named first
         since that's where Tej is based and where the real address + most
         projects are. Indore/Udaipur get named because real projects exist
         there. Surat/Gandhinagar are deliberately NOT named here — no
         project or presence there yet, so "serving clients across Gujarat,
         Rajasthan & Madhya Pradesh" carries the broader region honestly as
         a service-area claim rather than a fabricated portfolio claim (see
         CLAUDE.md's content rules). The full target-city list still lives
         in the JSON-LD `areaServed` field below, which is the legitimate
         place for it. -->
    <title>Nirmal Studio — Architects in Ahmedabad | Tej Shah</title>
    <meta
      name="description"
      content="Tej Shah's architecture, interior & landscape design studio based in Ahmedabad. Projects in Indore & Udaipur; serving Gujarat, Rajasthan & Madhya Pradesh."
    />
    <link rel="canonical" href="https://nirmalstudio.com/" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nirmal Studio" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="https://nirmalstudio.com/" />
    <meta property="og:title" content="Nirmal Studio — Architects in Ahmedabad | Tej Shah" />
    <meta
      property="og:description"
      content="Tej Shah's architecture, interior & landscape design studio based in Ahmedabad. Projects in Indore & Udaipur; serving Gujarat, Rajasthan & Madhya Pradesh."
    />
    <!-- Share image: picked in content/site.json (homepage.shareImage, the
         Citadel Tower render by default) and exported by
         scripts/build-content.mjs as a 1200x630 JPEG — OG's ideal size, and
         JPEG because not every link-preview crawler accepts WebP. -->
    <meta property="og:image" content="__NIRMAL_SHARE_IMAGE__" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nirmal Studio — Architects in Ahmedabad | Tej Shah" />
    <meta
      name="twitter:description"
      content="Tej Shah's architecture, interior & landscape design studio based in Ahmedabad. Projects in Indore & Udaipur; serving Gujarat, Rajasthan & Madhya Pradesh."
    />
    <meta name="twitter:image" content="__NIRMAL_SHARE_IMAGE__" />

    <!-- Favicon set. Cropped from Parth's real logo file (the lowercase "n"
         glyph from "Nirmal Studio Logo.png" / Business Card - Front.psd),
         not hand-drawn — colors are the logo's actual olive (#6C705D) on the
         site's cream background, not the site's bronze palette, since that's
         what the real mark uses. See the note flagged to Parth this session:
         the real logo's typeface/colors (olive "nirmal" + rust "studio")
         differ from what's implemented site-wide (Syne wordmark, bronze
         palette) — this favicon alone doesn't resolve that, it just uses the
         real asset for the one piece (the favicon) that had no site-wide
         palette commitment yet. favicon.svg embeds the same raster crop (no
         vector source exists for the real logo), so it matches the PNG
         fallbacks exactly rather than looking like a different mark. -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#7a5236" />

    <!-- Structured data — schema.org Architect (a LocalBusiness subtype).
         areaServed is the honest place to name the full target-city/state
         list: it's a service-area claim, not a claim of built work in every
         city. Surat and Gandhinagar have no project in content/projects/
         (Ahmedabad has 4, Indore 3, Udaipur 2) — they appear only here, never
         in visible copy, per CLAUDE.md's rule against misrepresenting the
         practice's actual work. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Architect",
        "name": "Nirmal Studio",
        "founder": {
          "@type": "Person",
          "name": "Tej Shah"
        },
        "description": "Tej Shah's architecture, interior & landscape design studio based in Ahmedabad, India.",
        "url": "https://nirmalstudio.com/",
        "image": "__NIRMAL_SHARE_IMAGE__",
        "logo": "https://nirmalstudio.com/icons/icon-512.png",
        "telephone": "+91-9106998434",
        "email": "tej@nirmalstudio.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "201, Second Floor, Tilakraj Complex, Panchavati 1st Lane, Ambavadi",
          "addressLocality": "Ahmedabad",
          "addressRegion": "Gujarat",
          "postalCode": "380006",
          "addressCountry": "IN"
        },
        "areaServed": [
          "Ahmedabad",
          "Indore",
          "Udaipur",
          "Surat",
          "Gandhinagar",
          "Gujarat",
          "Rajasthan",
          "Madhya Pradesh"
        ],
        "sameAs": __NIRMAL_SAME_AS__
      }
    </script>
    <!-- The share-image and sameAs placeholders are filled in at build
         time by vite.config.js from src/generated/meta.json (built from
         content/site.json), so the share image and social links in this raw
         HTML — which crawlers read — always match what the backend publishes. -->

    <!-- Fraunces (headings) + Syne (wordmark), chosen via Task #4's comparison
         pass. Self-hosted since v1 Phase 1d: the files sit next to the site on
         Cloudflare's edge, so there are no extra DNS+TLS handshakes to
         fonts.googleapis.com/fonts.gstatic.com, and — more importantly — the
         browser discovers the .woff2 immediately from the preload below
         instead of only after a stylesheet round-trip has finished.

         These @font-face rules are a faithful copy of the CSS Google served
         for the exact same request (Fraunces v38, Syne v24), including the
         unicode-range split, so rendering is unchanged. Only the vietnamese
         and greek slices are dropped (nothing on this site uses them; those
         glyphs would fall back per-character).

         Fraunces and Syne are both VARIABLE fonts: one file covers Fraunces
         300-600 and one covers Syne 400-800, which is why several @font-face
         blocks point at the same URL. Version numbers are in the file names,
         so the year-long immutable cache in public/_headers stays safe — a
         font update would be a new URL.

         font-display is deliberately different per family and must not be
         "simplified" to one value:
           Syne = optional. `block` was tried first and confirmed (via a real
             Slow-4G test) to STILL show two fonts — its swap period is
             infinite, so a late font swaps in after the fallback painted.
             `optional` has no swap period: the browser decides in ~100ms and,
             if the font isn't ready, uses the fallback for that whole visit
             and never swaps. No flash is possible under any network
             condition. Trade-off: on a slow cold load the loader wordmark may
             render in the fallback that one time. Preloading it below makes
             winning that ~100ms window far more likely than it was on Google
             Fonts, where the file couldn't even be discovered until the
             stylesheet had arrived.
           Fraunces = swap. It carries every heading on the page, so a longer
             invisible-text window would cost more than a swap does. -->
    <!-- Only the 6.5KB Syne subset is preloaded. Syne is font-display:optional, so it
         has ~100ms to arrive or it is not used at all for that visit — it genuinely
         needs the head start, and it renders the wordmark, the first thing on screen.
         Fraunces is deliberately NOT preloaded: it is font-display:swap (so text is
         never invisible, it just restyles), it was never preloaded before this change
         either, and at 67KB it would compete at top priority with the hero render —
         the LCP image — on exactly the mid-range-Android-on-mobile-data visitor this
         site is built for. -->
    <link rel="preload" href="/fonts/syne-v24-wordmark.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Fraunces — roman, variable 300-600 (one file, four declared weights,
         mirroring Google's own CSS so weight matching is identical). */
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 300 600;
        font-display: swap;
        src: url('/fonts/fraunces-v38-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces';
        font-style: normal;
        font-weight: 300 600;
        font-display: swap;
        src: url('/fonts/fraunces-v38-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Fraunces — italic 400. Really used: pull quotes (projectStory.js),
         Testimonials, Studio's intro line, Founders' "behind", and RichText's
         italic mark. Only fetched when italic text is actually on the page. */
      @font-face {
        font-family: 'Fraunces';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/fraunces-v38-italic-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fraunces';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/fraunces-v38-italic-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* Syne — the wordmark. Variable 400-800 in one file.
         Two sizes of the same font, and ORDER MATTERS: the tiny wordmark subset is
         declared LAST, so for the characters it covers (space + a-z, which is the
         entire wordmark, "nirmal" + " studio") it wins font matching and the full
         34.5KB file is never fetched. The full files stay declared so that any other
         character ever set in Syne still renders in Syne rather than falling back —
         it just costs a fetch on that rare page. */
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 400 800;
        font-display: optional;
        src: url('/fonts/syne-v24-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 400 800;
        font-display: optional;
        src: url('/fonts/syne-v24-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* The wordmark subset — space + a-z only, 6.5KB instead of 34.5KB. Declared last
         on purpose (see the note above). Regenerate with Google's own subsetter if the
         wordmark ever needs more characters:
         fonts.googleapis.com/css2?family=Syne:wght@400;800&display=optional&text=<chars> */
      @font-face {
        font-family: 'Syne';
        font-style: normal;
        font-weight: 400 800;
        font-display: optional;
        src: url('/fonts/syne-v24-wordmark.woff2') format('woff2');
        unicode-range: U+0020, U+0061-007A;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
